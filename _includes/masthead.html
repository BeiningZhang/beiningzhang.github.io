{% include base_path %}

<div class="masthead masthead--sidebar">
  <div class="masthead__inner-wrap">
    <nav id="site-nav" class="side-nav" aria-label="Primary">
      <button id="nav-toggle" class="side-nav__toggle" type="button" aria-label="Toggle navigation">
        <span class="side-nav__toggle-icon" aria-hidden="true"></span>
      </button>

      <ul class="side-nav__links">
        <li class="side-nav__item">
          <a class="side-nav__link" href="{{ base_path }}/">
            <span class="side-nav__text">Home</span>
          </a>
        </li>

        {% for link in site.data.navigation.main %}
          {% if link.url contains 'http' %}
            {% assign domain = '' %}
          {% else %}
            {% assign domain = base_path %}
          {% endif %}

          <li class="side-nav__item">
            <a class="side-nav__link" href="{{ domain }}{{ link.url }}">
              <span class="side-nav__text">{{ link.title }}</span>
            </a>
          </li>
        {% endfor %}
      </ul>

      <div class="side-nav__footer">
        <button id="theme-toggle" class="side-nav__theme" type="button" aria-label="Toggle theme">
          <span id="theme-icon" class="side-nav__theme-icon" aria-hidden="true" title="toggle theme"></span>
          <span class="side-nav__text">Theme</span>
        </button>
      </div>
    </nav>
  </div>
</div>
